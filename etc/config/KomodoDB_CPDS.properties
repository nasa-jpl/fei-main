#
# File: KomodoDB_CPDS.prop
#
# Version: $Id: KomodoDB_CPDS.properties,v 1.2 2003/02/27 22:45:08 txh Exp $
#
# Description: Define pooled connection data source for Komodo
#
#
SYB_HOSTNAME    = <mysql host>
SYB_PORT        = <mysql port>
SYB_DATABASE    = <database name>
SYB_USER        = <user name>
SYB_PASSWORD    = <user password>
SYB_DESCRIPTION = <description>

# JDBC Driver class for MySQL Connector/J 8.0+ (Java 17 compatible)
driverClass = com.mysql.cj.jdbc.Driver

# JDBC URL format: jdbc:mysql://<host>:<port>/<database>?useSSL=false&allowPublicKeyRetrieval=true
# Note: useSSL=false is recommended for development; use proper SSL certificates in production
jdbcUrl = jdbc:mysql://<mysql host>:<mysql port>/<database name>?useSSL=false&allowPublicKeyRetrieval=true
#
# Properties below will be used for configuring the connection pool when
# it is implemented in future release.
SYB_INITIAL_POOL_SIZE = 5
SYB_MIN_POOL_SIZE     = 3
SYB_MAX_POOL_SIZE     = 10
SYB_MAX_IDLE_TIME     = 600
SYB_PROPERTY_CYCLE    = 60
